
services:
  - type: web
    name: ag-sub2unlock-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: SITE_URL
        value: https://onefirstamane-ops.github.io/AG-SUB2UNLOCK
      - key: PYTHON_VERSION
        value: 3.13.13
